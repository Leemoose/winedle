<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Winedle icon</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #6b5544; }
  .icon {
    position: absolute; top: 0; left: 0;
    width: 100vmin; height: 100vmin;
    background-color: #6d1a26;
    background-image: radial-gradient(circle at 50% 32%, #8a2632, #4a0f1a 78%);
    display: flex; align-items: center; justify-content: center;
  }
  span {
    font-family: 'Bodoni Moda', Didot, Georgia, serif;
    font-weight: 500;
    font-size: 74vmin;
    line-height: 1;
    color: #f2e6d4;
    /* Optical centring: the cap sits high in the em box, so the glyph needs
     * nudging down rather than up to look centred in the square. */
    transform: translateY(4vmin);
  }
</style>
</head>
<body><div class="icon"><span>W</span></div></body>
</html>
